name: Generate Thumbnails

on:
  push:
    branches:
      - main
    paths:
      - 'all/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
          
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install lutgen
        run: cargo install lutgen-cli
      
      - name: Run thumbnail generation
        run: uv run main.py
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add thumbnails/ catppuccin_mocha/ README.MD
          git diff --quiet && git diff --staged --quiet || git commit -m "Update thumbnails and README"
          git push
