name: Generate Thumbnails

on:
  push:
    branches:
      - main
    paths:
      - 'all/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run thumbnail generation
        run: nix develop --command uv run main.py
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add thumbnails/ catppuccin_mocha/ README.MD
          git diff --quiet && git diff --staged --quiet || git commit -m "Update thumbnails and README"
          git push
